<!-- Riso Beaver: responsive canvas snippet. Double-click / double-tap to restart with a new stream. -->
<style>html:has(body > .riso-beaver),body:has(> .riso-beaver){margin:0;padding:0;overflow:hidden;height:100%}.riso-beaver{height:100vh;height:100dvh}</style>
<div class="riso-beaver" style="position:relative;width:100%;min-height:300px;box-sizing:border-box;overflow:hidden;background:#f3ecdc;touch-action:manipulation">
  <canvas style="position:absolute;inset:0;width:100%;height:100%;display:block" aria-label="Risograph animation of a beaver building a dam"></canvas>
</div>
<script>
(() => {
const root = document.currentScript.previousElementSibling;
const cv = root.querySelector('canvas'), ctx = cv.getContext('2d');
const PAPER = '#f3ecdc';
const INK = {yellow:'#ffe800',orange:'#ff6c2f',green:'#00a95c',blue:'#0078bf',brown:'#925f52',pink:'#ff48b0'};
const REG = {yellow:[0,0],orange:[.7,-.4],green:[-.6,.5],blue:[.5,.7],brown:[-.4,-.6],pink:[.8,.3]};
const TAU = Math.PI*2;
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a,b)=>x<a?a:x>b?b:x;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const hash=(i,j)=>{const h=Math.sin(i*127.1+j*311.7)*43758.5453;return h-Math.floor(h)};
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const nrm=(x,y)=>{const l=Math.hypot(x,y)||1;return[x/l,y/l]};

let W=1,H=1,S=1,Aw=1,Ah=1,dpr=1,rng,step=0,sized=false;
let comps,ampSum,damU,shorePh,gph1,gph2,sticks,muds,rocks,lodgeSticks,veg,pools,lilies,cracks,dirt,dashes;
let wind=.18,gustEnd=0,nextGust=8,bat={active:false},NT=0,GX=0,fly,B,LEGS,Q,dp,dpVis,L,G,T,FO,ripples,done,idleR,sq,deer,birds,flights;
let shc=document.createElement('canvas'),shx=shc.getContext('2d');

/* grain */
const gc=document.createElement('canvas');gc.width=gc.height=256;
{const g=gc.getContext('2d'),id=g.createImageData(256,256);
 for(let i=0;i<id.data.length;i+=4){const r=Math.random();
  if(r<.025){id.data[i]=60;id.data[i+1]=40;id.data[i+2]=30;id.data[i+3]=22;}
  else if(r<.05){id.data[i]=243;id.data[i+1]=236;id.data[i+2]=220;id.data[i+3]=80;}}
 g.putImageData(id,0,0);}
const grain=ctx.createPattern(gc,'repeat');

/* halftone patterns */
let PC={};
function pat(name,r,ang){const k=name+r+ang;if(PC[k])return PC[k];
 const cell=Math.max(3,Math.round(5*dpr)),c=document.createElement('canvas');c.width=c.height=cell;
 const g=c.getContext('2d');g.fillStyle=INK[name];g.beginPath();g.arc(cell/2,cell/2,r*cell,0,TAU);g.fill();
 const p=ctx.createPattern(c,'repeat');p.setTransform(new DOMMatrix().scaleSelf(1/(S*dpr)).rotateSelf(ang));return PC[k]=p;}

/* world */
const damX=()=>damU*Aw;
function sy(x){const u=x/Aw;let s=0;for(const c of comps)s+=c.a*Math.sin(TAU*c.f*u+c.p);return Ah*.5+s*Math.min(1,Ah*.17/ampSum);}
function pondF(x){const d=x-damX();return d<0?smooth(-.65,-.04,d):Math.exp(-((d/.012)**2));}
function hw(x,l){return lerp(.006,.03,l)*(1+.3*l*Math.sin(x*8+shorePh))+.2*Math.pow(l,1.4)*pondF(x);}
function reach(x){return GX*(Ah*.8+.25)+G*(.1+.32*G)*(1+.3*Math.sin(x*6.1+gph1)+.15*Math.sin(x*17+gph2))+pondF(x)*G*.18;}
function greenAt(x,y){const c=sy(x),h=hw(x,L);return clamp((reach(x)-(Math.abs(y-c)-h))/.08,0,1);}
function damFrame(){const x=damX(),y=sy(x),d=(sy(x+.001)-sy(x-.001))/.002,t=nrm(1,d);return{x,y,t,n:[-t[1],t[0]],half:hw(x,1)+.035};}
function damPoint(s,al=0){const f=damFrame(),b=-.014*(1-s*s)+al;return[f.x+f.n[0]*s*f.half+f.t[0]*b,f.y+f.n[1]*s*f.half+f.t[1]*b];}

function init(){
 let a=(Math.random()*2**31)|0;
 rng=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const R=(x=0,y=1)=>x+(y-x)*rng(), side=()=>rng()<.5?-1:1;
 comps=[{a:R(.03,.065),f:R(.5,1.1),p:R(0,TAU)},{a:R(.012,.03),f:R(1.3,2),p:R(0,TAU)},{a:R(0,.012),f:R(2.2,3.2),p:R(0,TAU)}];
 ampSum=comps.reduce((s,c)=>s+c.a,0);
 damU=R(.44,.6);shorePh=R(0,TAU);gph1=R(0,TAU);gph2=R(0,TAU);
 sticks=[];for(let i=0;i<90;i++){const s=R(-1,1);sticks.push({s,al:R(-.014,.01),ang:R(-.55,.55),len:R(.018,.042),o:Math.abs(s)*.85+R(0,.15)});}
 sticks.sort((a,b)=>a.o-b.o);
 muds=[];for(let i=0;i<34;i++){const s=R(-.95,.95);muds.push({s,al:R(-.01,.006),r:R(.008,.016),o:Math.abs(s)*.85+R(0,.15)});}
 muds.sort((a,b)=>a.o-b.o);
 rocks=[];for(let i=0;i<6;i++)rocks.push({s:R(-.11,.11),al:R(-.005,.005),r:R(.004,.008)});
 lodgeSticks=[];for(let i=0;i<22;i++)lodgeSticks.push({a:R(0,TAU),r0:R(0,.3),r1:R(.6,1.15)});
 veg=[];for(let i=0;i<650;i++){let d=.03+Math.pow(rng(),1.2)*.75;const r=rng();let type;
  if(d<.12&&r<.45)type='reed';else if(d>.28&&r<.12)type='tree';else if(r<.5)type='grass';else if(r<.78)type='shrub';else type='flower';
  const rel=type==='reed';if(rel)d=R(.002,.03);
  veg.push({u:rng(),side:side(),d,type,rel,th:R(.15,.85),sz:rng(),rot:R(0,TAU),seed:rng()});}
 pools=[];for(let i=0;i<12;i++)pools.push({u:R(.02,.98),side:side(),d:R(.004,.1),th:R(.2,.8),sz:R(.4,1),rot:R(0,TAU),e:R(.5,.9)});
 lilies=[];for(let i=0;i<46;i++)lilies.push({a:R(.02,.6),f:R(-.85,.85),th:R(.35,.95),r:R(.006,.012),rot:R(0,TAU)});
 cracks=[];for(let i=0;i<80;i++){const segs=[],n=2+(rng()*3|0);
  for(let k=0;k<n;k++){let x=0,y=0,an=R(0,TAU);const pts=[];for(let m=0;m<4;m++){an+=R(-.8,.8);const l=R(.006,.016);x+=Math.cos(an)*l;y+=Math.sin(an)*l;pts.push([x,y]);}segs.push(pts);}
  cracks.push({u:rng(),side:side(),d:R(.02,.6),segs});}
 dirt=[];for(let i=0;i<16;i++)dirt.push({u:rng(),side:side(),d:R(.08,.6),r:R(.04,.12),e:R(.5,1),rot:R(0,TAU)});
 dashes=[];for(let i=0;i<60;i++)dashes.push({u:rng(),o:R(-.75,.75),l:R(.008,.02)});
 B={pos:[0,0],head:0,sp:[],hidden:true,swim:0,spd:0,carry:null,ci:(rng()*3)|0,nod:0,sniff:0,dive:0,gait:0,rt:0};
 LEGS=[mk(1,.45,-1,.017,.012,.012,.011,.011,0,0),mk(1,.45,1,.017,.012,.012,.011,.011,1,0),
       mk(3,.1,-1,.021,.016,.015,.003,.013,1,1),mk(3,.1,1,.021,.016,.015,.003,.013,0,1)];
 resetSpine();
 NT=0;GX=0;dp=0;dpVis=0;L=0;G=0;T=0;FO=0;ripples=[];done=false;idleR=0;
 sq={kind:'sq',speed:.38,gait:22,pauseD:1,active:false,done:false};
 deer={kind:'deer',speed:.17,gait:8,pauseD:2.4,active:false,done:false};
 birds=[];flights=R(18,32);
bat={active:false,night:-1};wind=.18;gustEnd=0;nextGust=R(6,14);
 fly={active:false,next:R(50,70),x:0,y:0,a:0};
 script();
}
function mk(seg,t,side,off,l1,l2,rf,rs,grp,hind){return{seg,t,side,off,l1,l2,rf,rs,grp,hind,foot:[0,0],from:[0,0],st:0,stepping:false,lift:0};}

/* beaver rig */
const SEG=[.022,.026,.026,.022,.056];
function frameAt(g){const a=B.sp[g.seg],b=B.sp[g.seg+1];const[fx,fy]=nrm(a[0]-b[0],a[1]-b[1]);
 const nx=-fy*g.side,ny=fx*g.side;return{px:lerp(a[0],b[0],g.t)+nx*g.off,py:lerp(a[1],b[1],g.t)+ny*g.off,fx,fy,nx,ny,side0:g.side*.35};}
function restPos(g){const F=frameAt(g);return[F.px+F.fx*g.rf+F.nx*g.rs,F.py+F.fy*g.rf+F.ny*g.rs];}
function resetSpine(){const f=[Math.cos(B.head),Math.sin(B.head)];let p=[B.pos[0],B.pos[1]];B.sp=[p];
 for(const l of SEG){p=[p[0]-f[0]*l,p[1]-f[1]*l];B.sp.push(p);}
 LEGS.forEach(g=>{g.foot=restPos(g);g.from=[...g.foot];g.stepping=false;});}
function ik(ax,ay,tx,ty,l1,l2,ox,oy){let dx=tx-ax,dy=ty-ay,d=Math.hypot(dx,dy);const md=l1+l2-1e-4;
 if(d>md){tx=ax+dx/d*md;ty=ay+dy/d*md;d=md;}d=Math.max(d,1e-4);
 const a=Math.atan2(ty-ay,tx-ax),al=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
 const k1=[ax+Math.cos(a+al)*l1,ay+Math.sin(a+al)*l1],k2=[ax+Math.cos(a-al)*l1,ay+Math.sin(a-al)*l1];
 const d1=(k1[0]-ax)*ox+(k1[1]-ay)*oy,d2=(k2[0]-ax)*ox+(k2[1]-ay)*oy;return{knee:d1>d2?k1:k2,foot:[tx,ty]};}

/* behaviour script */
const cyD=()=>sy(damX());
const nextStick=()=>sticks[Math.min(sticks.length-1,Math.floor(dp*sticks.length)+4)];
function script(){
 Q=[{k:'until',t:4},
  {k:'do',f:()=>{B.hidden=false;B.pos=[clamp(damX()-.28,.08,Aw-.08),Ah+.12];B.head=-Math.PI/2+.3;resetSpine();}},
  {k:'go',p:()=>[damX()-.07,cyD()+.06]},{k:'go',p:()=>[damX()-.012,cyD()+.03]},
  {k:'face',p:()=>[damX(),cyD()]},{k:'wait',d:1.6,s:1},
  {k:'go',p:()=>[damX()+.045,cyD()-.035]},{k:'go',p:()=>[damX()-.005,cyD()-.035]},
  {k:'face',p:()=>[damX(),cyD()]},{k:'wait',d:1.4,s:1},{k:'do',f:trip}];
}
function trip(){
 const top=rng()<.5,fx=(rng()-.5)*.8;
 const ex=()=>[clamp(damX()+fx,.08,Aw-.08),top?-.18:Ah+.18];
 Q.push({k:'go',p:ex},{k:'do',f:()=>{B.hidden=true;if(!sq.done&&!sq.active&&T>24&&dp<.3)startCritter(sq);}},{k:'critter'},{k:'night',w:12},{k:'wait',d:1.3},
  {k:'do',f:()=>{B.carry=['stick','mud','rock','stick'][B.ci++%4];B.hidden=false;B.pos=ex();B.head=top?Math.PI/2:-Math.PI/2;resetSpine();}},
  {k:'go',p:()=>damPoint(nextStick().s,-.035)},{k:'face',p:()=>damPoint(nextStick().s,0)},
  {k:'wait',d:1.1,s:1},{k:'do',f:deliver});
}
function deliver(){
 dp=Math.max(dp+.05,clamp((T-NT-16)/108,0,1));if(T-NT>=124||dp>=.999)dp=1;
 B.carry=null;ripples.push({x:B.pos[0],y:B.pos[1],t0:T,life:1.6,m:.05});
 if(dp>=1)finale();else trip();
}
function finale(){
 Q.push({k:'go',p:()=>damPoint(-.55,-.06)},{k:'wait',d:.8,s:1},{k:'go',p:()=>damPoint(.55,-.06)},{k:'wait',d:.8,s:1},
  {k:'go',p:()=>damPoint(0,-.07)},{k:'face',p:()=>damPoint(0,0)},{k:'until',t:174},
  {k:'nod',d:2.4},{k:'wait',d:.5},{k:'go',p:()=>damPoint(-.72,-.02)},{k:'dive',d:1.6},{k:'do',f:()=>{done=true;sq.next=T+20+rng()*20;deer.next=T+45+rng()*30;outing();}});
}

/* crossers: deer & squirrel walk the dam line */
function crossPos(u,al){const f=damFrame(),s=u/f.half;if(Math.abs(s)<=1)return damPoint(s,al);
 const sg=Math.sign(s),b=damPoint(sg,al),e=u-sg*f.half;return[b[0]+f.n[0]*e,b[1]+f.n[1]*e];}
function startCritter(c){const f=damFrame();c.uMax=f.half+Ah*.6+.25;c.dir=rng()<.5?-1:1;c.u=-c.dir*c.uMax;
 c.active=true;c.phase=0;c.pt=0;c.pauseDone=false;c.look=0;c.moving=true;
 c.pauseU=c.kind==='deer'?0:-c.dir*(f.half+.06);}
function tickCritter(c,dt){if(!c.active)return;
 if(!c.pauseDone&&c.dir*(c.u-c.pauseU)>=0){c.pt+=dt;c.moving=false;
  c.look=c.kind==='deer'?Math.sin(c.pt/c.pauseD*TAU)*.9:0;if(c.pt>=c.pauseD){c.pauseDone=true;c.look=0;}return;}
 c.moving=true;c.u+=c.dir*c.speed*dt;c.phase+=dt*c.gait;
 if(c.dir*c.u>c.uMax){c.active=false;c.done=true;c.next=T+(c.kind==='deer'?60+rng()*40:40+rng()*30);}}
function spawnFlock(){const a=rng()*TAU,dx=Math.cos(a),dy=Math.sin(a),R0=Math.hypot(Aw,Ah)*.6+.2;
 const cx=Aw/2+(rng()-.5)*.4*Aw,cy=Ah/2+(rng()-.5)*.4*Ah,n=2+(rng()*2|0);
 for(let i=0;i<n;i++){const back=i*.12,side=(i%2?1:-1)*Math.ceil(i/2)*.1;
  birds.push({x:cx-dx*(R0+back)-dy*side,y:cy-dy*(R0+back)+dx*side,a,ph:rng()*TAU,spd:.42,span:.13+rng()*.04,life:0,L:(R0+back)*2+.4});}}

const lodgeP=()=>damPoint(-.72,-.02);
function outing(){
 const home=[{k:'go',p:lodgeP},{k:'dive',d:1.4},{k:'do',f:()=>{B.carry=null;outing();}}];
 Q.push({k:'wait',d:14+rng()*14},{k:'emerge',d:1.2,at:lodgeP});
 if(rng()<.5){ // gnaw a sapling on the pond shore, tow the branch home
  const a=.1+rng()*.4,sd=rng()<.5?-1:1;
  const shore=()=>{const x=damX()-a;return[x,sy(x)+sd*(hw(x,L)+.012)];},tree=()=>{const x=damX()-a;return[x,sy(x)+sd*(hw(x,L)+.045)];};
  Q.push({k:'do',f:()=>{B.sapling=tree;}},{k:'go',p:shore},{k:'face',p:tree},{k:'wait',d:3,s:1,gnaw:1},
   {k:'do',f:()=>{B.sapling=null;B.carry='branch';}},{k:'wait',d:.5},...home);
 }else{ // patch the dam with mud
  const sd=(rng()*2-1)*.8;
  // swim well out into the pond, float a moment, dive for a while, surface with mud, swim back
  const pondPt=(a,o)=>()=>{const x=damX()-a;return[x,sy(x)+o*hw(x,L)*.7];};
  const far=pondPt(.18+rng()*.2,(rng()*2-1)*.7),via=pondPt(.08+rng()*.06,(rng()*2-1)*.6);
  Q.push({k:'wait',d:.8},{k:'go',p:via},{k:'go',p:far},{k:'wait',d:1.2,s:1},{k:'dive',d:1.3},{k:'wait',d:2.5+rng()*2},
   {k:'emerge',d:1.1,at:far,carry:'mud'},{k:'wait',d:.8},{k:'go',p:via},
   {k:'go',p:()=>damPoint(sd,-.035)},{k:'face',p:()=>damPoint(sd,0)},{k:'wait',d:2.2,s:1},
   {k:'do',f:()=>{B.carry=null;if(muds.length<70)muds.push({s:sd+(rng()-.5)*.08,al:-.004+rng()*.008,r:.009+rng()*.006});
    const p=damPoint(sd,0);ripples.push({x:p[0],y:p[1],t0:T,life:1.6,m:.05});}},...home);
 }
}

function flowerSpots(){const out=[];for(const v of veg)if(v.type==='flower'){const x=v.u*Aw,y=sy(x)+v.side*v.d;
  if(greenAt(x,y)-v.th>.1&&x>.03&&x<Aw-.03&&y>.03&&y<Ah-.03)out.push([x,y]);}return out;}
function flyTarget(){const f=flowerSpots();if(f.length&&rng()<.6){fly.flower=true;return f[(rng()*f.length)|0];}
 fly.flower=false;return[.1+rng()*(Aw-.2),.1+rng()*(Ah-.2)];}
function tickBat(dt){const b=bat,night=Math.round(T/DAY+.3);
 if(!b.active){if(darkness()>.7&&b.night!==night){b.night=night;b.active=true;b.leaving=false;const e=rng()*TAU,r=Math.hypot(Aw,Ah)*.6;
   b.x=Aw/2+Math.cos(e)*r;b.y=Ah/2+Math.sin(e)*r;b.a=e+Math.PI;b.tt=0;b.tg=[Aw/2,Ah/2];}return;}
 if(!b.leaving&&darkness()<.6){b.leaving=true;const e=rng()*TAU;b.tg=[Aw/2+Math.cos(e)*(Aw+Ah),Ah/2+Math.sin(e)*(Aw+Ah)];}
 b.tt-=dt;if(!b.leaving&&(b.tt<=0||Math.hypot(b.tg[0]-b.x,b.tg[1]-b.y)<.03)){ // erratic hawking over the water
  const x=damX()-.5+rng()*.8,cx=clamp(x,.05,Aw-.05);b.tg=[cx,clamp(sy(cx)+(rng()*2-1)*(hw(cx,L)+.12),.05,Ah-.05)];b.tt=.35+rng()*.9;}
 const df=wrap(Math.atan2(b.tg[1]-b.y,b.tg[0]-b.x)-b.a);b.a+=clamp(df,-8*dt,8*dt);
 const sp=.42+.15*Math.sin(T*7);b.x+=Math.cos(b.a)*sp*dt;b.y+=Math.sin(b.a)*sp*dt;
 if(b.leaving&&(b.x<-.15||b.x>Aw+.15||b.y<-.15||b.y>Ah+.15))b.active=false;}
function drawBat(){const b=bat;if(!b.active)return;
 const px=1/S,f=.4+.6*Math.abs(Math.cos(T*26)),c=Math.cos(b.a),s=Math.sin(b.a),Lc=(u,v)=>[b.x+c*u-s*v,b.y+s*u+c*v];
 const P=new Path2D();let q=Lc(0,0);ell(P,q[0],q[1],.009,.0042,b.a);q=Lc(.0105,0);ell(P,q[0],q[1],.0038,.0034,b.a);
 for(const sd of[-1,1]){q=Lc(.012,sd*.0022);ell(P,q[0],q[1],.0022,.0012,b.a+sd*.5);
  const pts=[[.003,.003],[.006,.017*f],[-.002,.033*f],[-.009,.027*f],[-.008,.02*f],[-.013,.017*f],[-.01,.01*f],[-.014,.006],[-.006,.003]].map(([u,v])=>Lc(u,sd*v));
  P.moveTo(pts[0][0],pts[0][1]);P.lineTo(pts[1][0],pts[1][1]);P.lineTo(pts[2][0],pts[2][1]);
  for(let i=3;i<pts.length;i+=2){const m=Lc(0,0);P.quadraticCurveTo((pts[i][0]+pts[i-1][0])/2+(m[0]-(pts[i][0]+pts[i-1][0])/2)*.12,(pts[i][1]+pts[i-1][1])/2+(m[1]-(pts[i][1]+pts[i-1][1])/2)*.12,pts[i][0],pts[i][1]);
   if(pts[i+1])P.lineTo(pts[i+1][0],pts[i+1][1]);}
  P.closePath();}
 ctx.setTransform(dpr*S,0,0,dpr*S,0,0);
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.35;ctx.strokeStyle=PAPER;ctx.lineWidth=2.2*px;ctx.stroke(P);ctx.globalAlpha=1;
 ctx.globalCompositeOperation='multiply';
 ink('brown',50,()=>{ctx.globalAlpha=.95;ctx.fill(P);});ink('blue',51,()=>{ctx.globalAlpha=.8;ctx.fill(P);});
 ctx.setTransform(1,0,0,1,0,0);}
function tickFly(dt){const F=fly;
 if(!F.active){if(T>=F.next&&nightSoon(40))F.next=T+10;if(T>=F.next){const e=rng()*4|0;F.x=e===0?-.05:e===1?Aw+.05:rng()*Aw;F.y=e===2?-.05:e===3?Ah+.05:rng()*Ah;
   F.active=true;F.t=0;F.dur=22+rng()*14;F.land=0;F.leaving=false;F.tg=flyTarget();F.a=Math.atan2(F.tg[1]-F.y,F.tg[0]-F.x);}return;}
 F.t+=dt;
 if(!F.leaving&&(F.t>F.dur||darkness()>.02)){F.land=0;F.leaving=true;F.flower=false;const a=rng()*TAU;F.tg=[Aw/2+Math.cos(a)*(Aw+Ah),Ah/2+Math.sin(a)*(Aw+Ah)];}
 if(F.land>0){F.land-=dt;if(F.land<=0&&!F.leaving)F.tg=flyTarget();return;}
 const dx=F.tg[0]-F.x,dy=F.tg[1]-F.y,d=Math.hypot(dx,dy);
 if(!F.leaving&&d<.012){if(F.flower){F.land=1.5+rng()*2.5;F.x=F.tg[0];F.y=F.tg[1];}else F.tg=flyTarget();return;}
 const df=wrap(Math.atan2(dy,dx)+Math.sin(T*2.7)*.9+Math.sin(T*6.1)*.4-F.a);F.a+=clamp(df,-4*dt,4*dt);

const DAY=122,dayPh=(t=T)=>(t/DAY+.3)%1;

function tick(dt){

 if(done){idleR-=dt;if(idleR<=0){const p=damPoint(-.72,-.02);ripples.push({x:p[0]+(Math.random()-.5)*.04,y:p[1]+(Math.random()-.5)*.04,t0:T,life:2,m:.05});idleR=2.6;}}
 if(done&&B.hidden&&!sq.active&&!deer.active){if(T>=sq.next)startCritter(sq);else if(T>=deer.next)startCritter(deer);}
 if(!deer.done&&!deer.active&&!sq.active&&T>=(1-.3)*DAY)startCritter(deer);
 tickCritter(sq,dt);tickCritter(deer,dt);tickFly(dt);tickBat(dt);
 if(T>=flights){if(darkness()<.3){spawnFlock();flights=T+22+rng()*23;}else flights=T+8;}
 for(const b of birds){b.x+=Math.cos(b.a)*b.spd*dt;b.y+=Math.sin(b.a)*b.spd*dt;b.life+=b.spd*dt;b.ph+=dt*7;}
 birds=birds.filter(b=>b.life<b.L);
 let vx=0,vy=0;B.sniff=0;B.gnaw=0;
 const a=Q[0];
 if(a){
  if((a.k==='go'||a.k==='face')&&!a.pt)a.pt=typeof a.p==='function'?a.p():a.p;
  switch(a.k){
  case 'until':B.sniff=1;if(T>=a.t)Q.shift();break;
  case 'wait':a.e=(a.e||0)+dt;B.sniff=a.s?1:0;B.gnaw=a.gnaw?1:0;if(a.gnaw&&Math.random()<dt*3){const p=B.sp[0];ripples.push({x:p[0],y:p[1],t0:T,life:.8,m:.02});}if(a.e>=a.d)Q.shift();break;
  case 'do':Q.shift();a.f();break;
  case 'emerge':if(!a.init&&(sq.active||deer.active||nightSoon(25)))break;if(!a.init){a.init=1;const p=a.at();B.pos=[p[0],p[1]];B.head=rng()*TAU;resetSpine();
   B.hidden=false;B.dive=1;B.swim=1;B.carry=a.carry||null;}
   a.e=(a.e||0)+dt;B.dive=1-Math.min(1,a.e/a.d);a.r=(a.r||0)-dt;
   if(a.r<=0){ripples.push({x:B.pos[0],y:B.pos[1],t0:T,life:1.6,m:.06});a.r=.4;}
   if(a.e>=a.d){B.dive=0;Q.shift();}break;
  case 'night':NT+=dt;if(!nightSoon(a.w)&&!deer.active)Q.shift();break;
  case 'critter':if(!sq.active&&!deer.active)Q.shift();break;
  case 'go':{const dx=a.pt[0]-B.pos[0],dy=a.pt[1]-B.pos[1],d=Math.hypot(dx,dy);
   if(d<.01){Q.shift();break;}
   const df=wrap(Math.atan2(dy,dx)-B.head);B.head+=clamp(df,-3.4*dt,3.4*dt);
   const sp=lerp(.15,.2,B.swim)*clamp(Math.cos(df),.15,1)*Math.min(1,d/.05+.3);
   vx=Math.cos(B.head)*sp;vy=Math.sin(B.head)*sp;break;}
  case 'face':{a.e=(a.e||0)+dt;const df=wrap(Math.atan2(a.pt[1]-B.pos[1],a.pt[0]-B.pos[0])-B.head);
   B.head+=clamp(df,-2.6*dt,2.6*dt);vx=Math.cos(B.head)*.025;vy=Math.sin(B.head)*.025;

  case 'dive':a.e=(a.e||0)+dt;B.dive=Math.min(1,a.e/a.d);a.r=(a.r||0)-dt;

  }
 }
 if(B.hidden)return;
 B.pos[0]+=vx*dt;B.pos[1]+=vy*dt;B.spd=Math.hypot(vx,vy);B.gait+=B.spd*dt*90;
 // spine: follow-the-leader chain
 B.sp[0]=[B.pos[0],B.pos[1]];
 for(let i=1;i<6;i++){const p=B.sp[i-1],q=B.sp[i];const[ux,uy]=nrm(q[0]-p[0],q[1]-p[1]);q[0]=p[0]+ux*SEG[i-1];q[1]=p[1]+uy*SEG[i-1];}
 // land / water
 const m=B.sp[2],hx=hw(m[0],L),inW=hx>.02&&Math.abs(m[1]-sy(m[0]))<hx-.006;
 B.swim+=((inW?1:0)-B.swim)*(1-Math.exp(-dt*4));
 // legs: diagonal-gait foot planting + 2-bone IK (solved at draw)
 const moving=B.spd>.01,busy=[false,false];LEGS.forEach(g=>{if(g.stepping)busy[g.grp]=true;});
 for(const g of LEGS){const F=frameAt(g);
  if(B.swim>.5){const ph=T*9+(g.side>0?Math.PI:0),amp=moving?1:.3;

   const k=1-Math.exp(-dt*14);g.foot=[lerp(g.foot[0],tg[0],k),lerp(g.foot[1],tg[1],k)];g.stepping=false;g.lift=0;continue;}
  const des=[F.px+F.fx*g.rf+F.nx*g.rs+vx*.14,F.py+F.fy*g.rf+F.ny*g.rs+vy*.14];
  if(g.stepping){g.st+=dt/.15;const s=Math.min(1,g.st),e=s*s*(3-2*s);

   if(g.st>=1){g.stepping=false;g.lift=0;}}
  else{const d=Math.hypot(g.foot[0]-des[0],g.foot[1]-des[1]);
   if((d>(moving?.018:.005)&&!busy[1-g.grp])||d>.06){g.stepping=true;g.st=0;g.from=[...g.foot];busy[g.grp]=true;}}
 }

}

 {const n=Hp(.0255,0);ell(nose,n[0],n[1],.0034*hs,.0048*hs,ha);}
 // tail: furry stalk into a flat scaly paddle

 {const a=off(sp[4],tn,.01),b=off(sp[4],tn,-.01),c=off(off(sp[4],tv,.016),tn,.008),e=off(off(sp[4],tv,.016),tn,-.008);

function drawCritters(){

    const st=Math.sin(c.phase+ph)*.022*sw,h=P(f0+st,side*.02),r=P(f0,side*.012);

   const hc=[nb[0]+lx*.045,nb[1]+ly*.045],Hq=(f,n)=>[hc[0]+lx*f+lnx*n,hc[1]+ly*f+lny*n];
   ell(main,hc[0],hc[1],.016,.0105,la);let m=Hq(.014,0);ell(main,m[0],m[1],.009,.0065,la);

function drawFly(){const F=fly;if(!F.active)return;

  p=Lc(-.006,sd*.008*f);ell(wings,p[0],p[1],.0068,.008*f+.0008,a+sd*.45);

 {const p=Lc(-.009,0),q=Lc(.009,0);body.moveTo(p[0],p[1]);body.lineTo(q[0],q[1]);}
